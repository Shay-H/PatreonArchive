services:
  flaresolverr:
    # Pinned for reproducibility — :latest is load-bearing for all Patreon fetching.
    # digest sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    #
    # Keep this reasonably current: Cloudflare rotates its challenge and an
    # outdated solver stops clearing it entirely. v3.5.0 reached that point in
    # Oct 2026 — every patreon.com fetch logged "Challenge detected ... Timeout
    # after N seconds" and returned HTTP 500, for every creator, with or
    # without cookies. v3.5.2 solves the same page in ~20s.
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patreon-archive
    env_file:
      - .env
    environment:
      # Absolute path inside the container; points at the mounted ./data volume.
      - DATABASE_URL=sqlite:////app/data/patreon_archive.db
      - DATA_ROOT=data
      - RAW_ROOT=data/raw
    volumes:
      # Persists the SQLite DB, raw patreon-dl downloads, and the cinebingers
      # cookie file (data/cinebingers_cookies.json) across rebuilds.
      - ./data:/app/data
    ports:
      # Bind to loopback only; the host nginx terminates public traffic.
      # 8001 avoids colliding with Consensus on 8000.
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: patreon-archive-network
    driver: bridge
