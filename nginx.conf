# Patreon Archive - nginx site config for the VPS host.
#
# Install on the VPS as:
#   /etc/nginx/sites-available/archive.shay-h.com
# then:
#   ln -s /etc/nginx/sites-available/archive.shay-h.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The app runs in Docker, published on 127.0.0.1:8001 (see docker-compose.yml).

upstream patreon_archive {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name archive.shay-h.com;
    charset utf-8;

    # The archive imports can be large; allow generous request bodies.
    client_max_body_size 50M;

    # Sync log streaming / long-running sync POSTs shouldn't time out early.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://patreon_archive;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# HTTPS configuration.
# The easiest path is to let certbot manage this automatically:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d archive.shay-h.com
# certbot will inject the `listen 443 ssl` block and the HTTP->HTTPS redirect
# into the server block above, so you usually don't need to edit anything here.
